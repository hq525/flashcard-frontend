version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use the same reviewed runtime as local development.
        - nvm install
        - nvm use
        - npm ci
    build:
      commands:
        # VITE_* public API, Cognito and media configuration comes from Amplify.
        # Never set client secrets or shared API keys in the browser build.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
